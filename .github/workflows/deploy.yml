name: "Deploy Chirpy to VPS"

on:
  push:
    branches:
      - blog
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - "docs/**"

  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须为 0，确保 Chirpy 插件能读取 Git 历史
          # 如果你的 assets 是子模块，取消下面注释
          # submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Site
        run: |
          # 配置 Git 身份，防止构建脚本报错
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # 1. 打印 _posts 列表审计 (排查是否又是 Demo 数据)
          echo "Checking source posts..."
          ls _posts/

          # 2. 如果你的主题需要编译静态资源，运行此脚本
          if [ -f "tools/init.sh" ]; then
            chmod +x tools/init.sh
            ./tools/init.sh
          fi

          # 3. 正式构建到 _site 目录
          bundle exec jekyll build
        env:
          JEKYLL_ENV: "production"

      - name: Clean VPS directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf /var/www/blog/*

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "_site/*"
          target: "/var/www/blog"
          strip_components: 1

      - name: Fix Permissions
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo chown -R $USER:$USER /var/www/blog
            sudo chmod -R 755 /var/www/blog
            sudo chcon -Rt httpd_sys_content_t /var/www/blog || true
