name: Deploy Chirpy to VPS

on:
  push:
    branches: [ blog ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true # 确保拉取了 assets/lib 子模块

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Chirpy 建议使用 v20 或更高

      - name: Build Frontend Assets
        run: |
          npm install
          # 这一步会生成编译 CSS 所需的临时文件和 vendors 路径
          npm run build

      - name: Build Jekyll Site
        run: |
          # 使用 --future 确保 2026 年的文章能被渲染
          bundle exec jekyll build --future

          # 【调试命令】如果这里还是 0.7s，看这一步输出
          echo "Checking generated posts..."
          find _site/posts -name "*.html" | head -n 5
        env:
          JEKYLL_ENV: production

      - name: Clean and Copy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf /var/www/blog/*

      - name: Deploy to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "_site/*"
          target: "/var/www/blog"
          strip_components: 1
