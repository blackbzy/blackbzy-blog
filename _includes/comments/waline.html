<script>
  (function () {
    const walineServerURL = 'https://comment.blackbzy.com/'; // 你的 Waline 地址

    // 1. 动态加载 CSS
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://unpkg.com/@waline/client@v3/dist/waline.css';
    document.head.appendChild(link);

    // 2. 创建并注入 Waline 容器
    const walineDiv = document.createElement('div');
    walineDiv.id = 'waline';
    const $footer = document.querySelector('footer');
    if ($footer) {
      $footer.insertAdjacentElement('beforebegin', walineDiv);
    }

    // 3. 异步初始化 Waline
    import('https://unpkg.com/@waline/client@v3/dist/waline.js').then(({ init }) => {
      // 获取当前主题状态
      // Chirpy 默认在 html 标签上通过 data-mode 属性记录主题
      const getTheme = () => document.documentElement.getAttribute('data-mode') === 'dark';

      const waline = init({
        el: '#waline',
        serverURL: walineServerURL,
        dark: 'html[data-mode="dark"]', // 关键：自动监听 HTML 上的主题属性变化
        reaction: true, // 可选：开启表情互动
        // 这里可以继续添加 site.comments.waline.xxx 等 Jekyll 配置变量
      });

      // 4. 监听主题切换事件 (同步 Chirpy 的主题切换)
      window.addEventListener('message', (event) => {
        if (
          event.source === window &&
          event.data &&
          event.data.id === Theme.ID // 匹配 Chirpy 的主题 ID
        ) {
          // 注意：Waline v3 支持使用选择器自动切换，通常不需要手动 postMessage
          // 如果需要手动强制刷新，可以在此处调用 waline 的更新方法
        }
      });
    });
  })();
</script>
