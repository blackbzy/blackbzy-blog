name: Deploy Chirpy to VPS

on:
  push:
    branches:
      - blog
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Chirpy 必须

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Site
        run: |
          # 1. 身份配置
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # 2. 初始化资源 (Chirpy 必须)
          chmod +x tools/init.sh
          ./tools/init.sh

          # 3. 关键：执行构建，生成 _site 文件夹
          bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Clean VPS directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf /var/www/blog/*

      - name: Copy _site to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "_site/*"  # 【关键】只发送构建好的静态文件
          target: "/var/www/blog"
          strip_components: 1

      - name: Fix Permissions
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo chown -R $USER:$USER /var/www/blog
            sudo chmod -R 755 /var/www/blog
            sudo chcon -Rt httpd_sys_content_t /var/www/blog || true
